
name: Site Builder JSON → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site-project.json
      - site-builder.html
      - scripts/build-site.mjs
      - package.json
      - font-width-test.html
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install generator
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Install browser
        run: |
          for file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$file" ] || continue
            if grep -qi 'packages.microsoft.com' "$file"; then
              sudo mv "$file" "$file.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Generate static site from JSON
        run: npm run build

      - name: Include font diagnostic
        run: cp font-width-test.html dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
