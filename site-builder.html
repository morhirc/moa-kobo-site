<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>morhirc Site Builder v0.85</title>
<style>
  :root {font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif; color:#202936; background:#eef1f5; font-size:14px}
  * {box-sizing:border-box}
  body {margin:0}
  button,input,textarea,select {font:inherit}
  button {cursor:pointer}
  button:disabled {opacity:.4;cursor:not-allowed}
  .top {height:64px;display:flex;gap:13px;align-items:center;padding:0 18px;background:#192438;color:#fff;position:relative;z-index:20;box-shadow:0 2px 14px #101c3020}
  .brand {font-weight:800;letter-spacing:.02em;font-size:17px;white-space:nowrap}
  .version {font-size:10px;color:#a8bbd7;display:block;margin-top:1px;font-weight:500}
  .top input.project-name {border:1px solid #536176;background:#25324a;color:#fff;border-radius:7px;padding:8px 10px;width:165px}
  .top button {border:1px solid #506079;color:#f1f4fb;border-radius:7px;padding:9px 11px;background:#283751;white-space:nowrap}
  .top button:hover {background:#384a6b}
  .top .primary {background:#2875e8;border-color:#2875e8;font-weight:700}
  .top .primary:hover {background:#1c65cc}
  .top .spacer {flex:1}
  .shell {height:calc(100dvh - 64px);min-height:480px;display:grid;grid-template-columns:232px minmax(0,1fr) 266px}
  .sidebar {background:#fff;border-right:1px solid #dce3ec;overflow-y:auto;padding:20px 16px}
  .inspector {background:#fff;border-left:1px solid #dce3ec;border-right:none}
  .section-head {display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:13px;font-weight:800;letter-spacing:.02em}
  .small-btn {border:1px solid #ccd5e1;background:#fff;border-radius:7px;padding:5px 9px;font-size:12px}
  .small-btn:hover {background:#f1f5fa}
  .pages {display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
  .page {padding:10px 10px;border-radius:8px;border:1px solid transparent;background:#f6f8fb;display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0}
  .page:hover {background:#eaf0f9}
  .page.active {background:#e8f1ff;border-color:#99bef4;color:#0b4aa2}
  .page .name {flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page .del {border:0;background:transparent;color:#9ba5b3;font-size:17px;padding:0 4px}
  .page .del:hover {color:#d03b3b}
  .add-position {display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:12px;color:#52647d}
  .add-position label{white-space:nowrap;font-weight:700}
  .add-position select{flex:1;min-width:0;padding:8px 6px;border:1px solid #cbd6e4;border-radius:6px;background:#fff;color:#22334c;font-size:12px}
  .placement-overlay {position:absolute;inset:0;z-index:1000;cursor:crosshair;background:rgba(37,117,232,.045);outline:2px dashed #2575dd;outline-offset:-2px;touch-action:pan-y}
  .placement-guide {position:sticky;top:12px;display:table;margin:12px auto;padding:9px 13px;border-radius:8px;background:#193b69;color:#fff;font-size:12px;font-weight:700;pointer-events:none;box-shadow:0 4px 10px #173e6944;max-width:calc(100% - 32px);text-align:center}
  .elements {display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .element-add {border:1px solid #d8e1ec;border-radius:9px;background:#fafbfd;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#2d3d52}
  .element-add:hover {border-color:#7aafea;background:#f0f7ff}
  .glyph {font-size:20px;font-weight:700}
  .element-add span:last-child {font-size:12px}
  .sidebar-hint {color:#727f90;font-size:12px;line-height:1.8;margin-top:16px}

  /* v0.36 — crowded tile grid becomes compact, collapsible category rows */
  .decoration-settings{margin:10px 0;border:1px solid #e1e8f2;border-radius:8px;overflow:hidden}
  .decoration-settings>summary{list-style:none;cursor:pointer;padding:10px 12px;background:#f7f9fc;font-weight:700;font-size:12px;color:#41546d}
  .decoration-settings>summary::-webkit-details-marker{display:none}
  .decoration-settings>summary::after{content:'⌄';float:right}
  .decoration-settings[open]>summary::after{content:'⌃'}
  .decoration-settings .decoration-fields{padding:10px}
  .catalog-basic-heading{font-size:12px;color:#64748b;font-weight:750;margin:0 0 9px}
  .catalog-group{margin-top:11px;border:1px solid #dae4f0;border-radius:9px;background:#fff;overflow:hidden}
  .catalog-group>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;font-size:12px;font-weight:800;color:#2d405a;user-select:none;background:#f7f9fc;min-height:40px}
  .catalog-group>summary::-webkit-details-marker{display:none}
  .catalog-group>summary:hover{background:#edf5ff;color:#1354a3}
  .catalog-group>summary:focus-visible{outline:2px solid #2780ed;outline-offset:-3px}
  .catalog-group>summary .catalog-chevron{margin-left:auto;color:#7b8ea7;transition:transform .15s}
  .catalog-group[open]>summary .catalog-chevron{transform:rotate(180deg)}
  .catalog-group[open]>summary{border-bottom:1px solid #e3eaf4;background:#f5f9ff}
  .catalog-picks{display:flex;flex-direction:column;padding:5px;gap:2px}
  .catalog-pick{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:37px;padding:8px 9px;border:1px solid transparent;border-radius:7px;background:#fff;color:#34465f;font-size:12px;line-height:1.35}
  .catalog-pick:hover{background:#edf5ff;color:#175aa7;border-color:#c8def9}
  .catalog-pick:focus-visible{outline:2px solid #2875e8;outline-offset:-2px}
  .catalog-pick .catalog-icon{display:inline-flex;justify-content:center;align-items:center;flex:none;width:24px;color:#55718d;font-size:15px;font-weight:750}
  .catalog-group .site-common-row{color:#175aa7}
  /* v0.37: keep the immediate six tools in two columns at half the old height. */
  .catalog-basic .element-add{min-height:46px;flex-direction:row;justify-content:flex-start;gap:9px;padding:8px 9px}
  .catalog-basic .glyph{width:20px;flex:none;font-size:17px;line-height:1;text-align:center}
  .catalog-basic .element-add span:last-child{font-size:12px;white-space:nowrap}
  .catalog-heading-gap{margin-top:24px!important}
  @media(max-width:580px){.catalog-basic .element-add{min-height:44px;padding:7px 5px;gap:4px}.catalog-basic .glyph{width:16px;font-size:15px}.catalog-group>summary{padding:10px 7px}.catalog-pick{padding:7px 5px;gap:5px}.catalog-pick .catalog-icon{width:20px}}
  /* v0.37: page outlines and background sections live in the Page tab. */
  .page-sidebar .pages{gap:7px;margin:0}
  .page-entry{min-width:0}
  .page-entry .page{padding:4px 5px 4px 10px;min-height:46px;gap:2px}
  .page-entry .page .name{display:block;border:0;background:transparent;color:inherit;font:inherit;text-align:left;min-height:36px;padding:7px 4px;cursor:pointer}
  .page-entry .page .name:focus-visible,.page-entry .page .disclose:focus-visible{outline:2px solid #2479e5;outline-offset:-2px;border-radius:5px}
  .page-entry .page .disclose{flex:none;width:29px;height:30px;border:0;border-radius:6px;background:transparent;color:#657a94;cursor:pointer;transition:transform .15s}
  .page-entry .page .disclose:hover{background:#dceaff;color:#15589c}
  .page-entry .page .disclose[aria-expanded="true"] .chevron{display:inline-block;transform:rotate(90deg)}
  .page-entry .page .del{flex:none;width:24px;height:30px;font-size:16px;border-radius:6px}
  .page-subtree{border-left:2px solid #cadcf2;margin:5px 0 13px 16px;padding:8px 0 2px 10px}
  .page-subtree .section-head{margin:2px 0 10px;font-size:12px;color:#415672}
  .page-subtree .section-item{min-height:37px;font-size:12px;padding:7px 8px;gap:7px}
  .page-subtree .section-item span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .page-subtree .section-items{margin:0 0 8px;gap:6px}
  .page-settings-btn{display:block;width:100%;margin:8px 0 3px!important;text-align:center}
  .page-empty{color:#8794a5;font-size:12px;margin:6px 3px 11px}

  .workarea {overflow:auto;background:#e9eef4;padding:20px 28px 56px}
  .stage-top {display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 18px;max-width:1100px}
  .stage-note {font-size:12px;color:#68788b}
  .top {gap:8px;overflow-x:auto;scrollbar-width:thin}
  .top-responsive {display:flex;align-items:center;gap:6px;flex:none;padding-left:9px;border-left:1px solid #52627a}
  .top .device {display:flex;align-items:center;gap:2px;padding:3px;background:#101b2d;border-radius:7px;border:1px solid #55667e}
  .top .device button {border:0;background:transparent;color:#dde8fa;border-radius:5px;padding:7px 7px;font-size:12px}
  .top .device button:hover {background:#364965}
  .top .device button.active {background:#deebff;color:#1259b5;font-weight:800}
  .top #autoLayoutBtn {background:#dbeaff;border-color:#88afe0;color:#164d8d;font-weight:750;padding:7px 9px}
  .top #autoLayoutBtn:hover {background:#c8e1ff}
  .top #unlinkLayoutBtn {border-color:#afc3df;color:#e9f1ff;padding:7px 9px}
  .top #unlinkLayoutBtn:hover:not(:disabled) {background:#384f72}
  .top .layout-status {color:#b8d6fa;font-size:11px;white-space:nowrap;min-width:44px}
  .top .responsive-mode-caption{font-size:11px;color:#daeaff;white-space:nowrap;font-weight:700}
  .top .responsive-mode-select{height:31px;min-width:100px;max-width:115px;border:1px solid #7196c7;border-radius:6px;padding:4px 5px;color:#163d74;background:#e5f1ff;font-size:12px;font-weight:750;cursor:pointer}
  .top .responsive-mode-select:focus-visible{outline:2px solid #7db9ff;outline-offset:2px}
  .top .spacer {min-width:5px}
  .stage-top {margin-bottom:12px;min-height:16px}
  .stage {width:max-content;min-width:100%;display:flex;justify-content:center}
  .paper {position:relative;flex:none;background:#fff;box-shadow:0 9px 26px #1b344e26;outline:1px solid #c5d1dd;overflow:hidden;transition:width .16s ease;touch-action:pan-y}
  /* v0.81: Only in the editor, expose elements left below the final background section.
     A warning surface is deliberately not part of the exported HTML. */
  .editor-outside-zone{position:absolute;left:0;right:0;z-index:0;pointer-events:none;
    border-top:3px dashed #f59e0b;
    background:repeating-linear-gradient(135deg,#26364d 0,#26364d 12px,#34465d 12px,#34465d 24px)}
  .editor-outside-label{position:absolute;top:7px;left:12px;max-width:calc(100% - 24px);padding:5px 10px;
    color:#8d4716;background:#ffedd5;border:1px solid #e8a76c;border-radius:5px;
    font-size:12px;line-height:1.5;font-weight:750;white-space:normal}
  .element.editor-outside-part{outline:2px dashed #d97706;outline-offset:2px}
  .element.editor-outside-part.selected{outline:2px solid #2680ed}
  .section-item.outside-jump{background:#fff7ed;border-color:#efbd8d;color:#974610;font-weight:700}
  .section-item.outside-jump:hover{background:#ffedd5}
  .bg-section {position:absolute;left:0;width:100%;z-index:1;cursor:pointer;outline:1px solid transparent;outline-offset:-1px}
  .bg-section:hover {outline:2px dashed #4d97ef;outline-offset:-2px}
  .bg-section.selected {outline:3px solid #2479e5;outline-offset:-3px;z-index:3}
  .bg-section .section-tag {position:absolute;top:8px;left:9px;pointer-events:none;color:#fff;font-weight:700;font-size:11px;line-height:1.3;padding:5px 8px;border-radius:5px;background:#1d4a80d9;opacity:0;transition:opacity .15s}
  .bg-section:hover .section-tag,.bg-section.selected .section-tag {opacity:1}
  .bg-section .section-resize {position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:88px;height:15px;border:2px solid #2274ce;border-radius:5px;background:#fff;box-shadow:0 2px 9px #2d55754a;cursor:ns-resize;display:none;z-index:12}
  .bg-section:hover .section-resize,.bg-section.selected .section-resize {display:block}
  .section-items {display:flex;flex-direction:column;gap:6px;margin:0 0 18px}
  .section-item {display:flex;align-items:center;gap:8px;border:1px solid #dae3ee;border-radius:7px;background:#fafbfd;padding:8px 9px;text-align:left;color:#35445a;width:100%}
  .section-item.active {border-color:#7db0ed;background:#e6f1ff;color:#125aa6}
  .section-swatch {display:inline-block;flex:none;width:19px;height:19px;border:1px solid #bccbdc;border-radius:4px;background-size:cover;background-position:center}
  /* 編集専用の上掛けグリッド。どの背景セクションやパーツの上でも見え、クリックは透過します。 */
  .editor-grid-overlay{position:absolute;inset:0;z-index:700;pointer-events:none;background-image:
      linear-gradient(to right,rgba(25,102,185,.24) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(25,102,185,.24) 1px,transparent 1px),
      linear-gradient(to right,rgba(14,82,159,.42) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(14,82,159,.42) 1px,transparent 1px);
    background-size:20px 20px,20px 20px,100px 100px,100px 100px}
  .editor-grid-overlay::before{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:2px dashed rgba(17,110,217,.67)}
  .editor-grid-overlay .grid-section-mid{position:absolute;left:0;right:0;border-top:1px dashed rgba(17,110,217,.68)}
  .top .top-grid-btn{font-size:12px;padding:7px 10px;border-color:#70819d;white-space:nowrap}
  .top .top-grid-btn.active{background:#dcecff;border-color:#7fb3ed;color:#1655a7;font-weight:750}
  .top .top-grid-btn:focus-visible{outline:2px solid #9aceff;outline-offset:2px}

  .element {position:absolute;touch-action:none;user-select:none;outline:1px solid transparent;cursor:grab;overflow:visible}
  .element.selected {outline:2px solid #2680ed;z-index:500!important} /* 選択したパーツを重なりの最前面へ */
.inspector-text-mode{padding:9px 10px!important;border-radius:7px;background:#eff5ff;color:#235493!important;line-height:1.6}.inspector-text-mode.is-partial{background:#deecff;color:#123d7c!important;font-weight:700}
  .element:hover:not(.selected) {outline:1px dashed #81abdf}
  .element .content {width:100%;height:100%;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}
  .element .content[contenteditable="true"] {cursor:text;user-select:text;box-shadow:inset 0 0 0 1px #9bc1fc;background:#ffffffee}
  /* v0.82: a rectangle can contain editable, centered text without introducing a second movable part. */
  .element .content.shape-text-content{display:flex;flex-direction:column;justify-content:center}
  .element .content.shape-text-content .shape-caption{display:block;width:100%;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .element .content.shape-text-content[contenteditable="true"]{background-color:inherit;outline:2px solid #76b0f2;outline-offset:-2px}

  .element img {height:100%;width:100%;object-fit:cover;pointer-events:none}
  .element .resize {display:none;position:absolute;width:14px;height:14px;bottom:-8px;right:-8px;background:#fff;border:2px solid #2680ed;border-radius:3px;cursor:nwse-resize;z-index:12}
  .element.selected .resize {display:block}
  .element .pill {height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 12px;white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere}
  .element .line {width:100%;height:100%;border-top:2px solid #29384a}
  .element.hover-lift:hover:not(.selected) .content {transform:translateY(-4px);box-shadow:0 8px 20px #102c4d26}
  .element .content {transition:transform .17s ease,box-shadow .17s ease}

  /* v0.13 — simple preset colors with optional native advanced picker */
  .color-control{display:flex;align-items:center;min-width:0}
  .color-value{position:absolute!important;width:1px!important;height:1px!important;opacity:0;pointer-events:none;padding:0!important;border:0!important}
  .color-trigger{display:inline-flex;align-items:center;justify-content:flex-start;gap:9px;width:100%;height:35px;border:1px solid #bdcbe0;border-radius:7px;background:#fff;color:#263649;cursor:pointer;padding:4px 8px;font-size:12px;text-align:left}
  .color-trigger:hover{border-color:#579de7;background:#f7fbff}
  .color-trigger:focus-visible{outline:2px solid #2875e8;outline-offset:2px}
  .color-trigger .color-chip{display:block;flex:none;width:30px;height:23px;background:var(--current-color);border:1px solid #9ca8b6;border-radius:4px;box-shadow:inset 0 0 0 1px #fff5}
  .color-trigger .color-code{flex:1;font-variant-numeric:tabular-nums;font-size:12px;color:#4b5b6e}
  .color-trigger .color-arrow{color:#65788d}
  .color-control.compact .color-trigger{width:50px;height:31px;gap:3px;padding:3px 5px}
  .color-control.compact .color-trigger .color-chip{width:29px;height:23px}
  .color-control.compact .color-trigger .color-code{display:none}
  .color-control.compact .color-trigger .color-arrow{font-size:10px}
  .color-palette{position:fixed;z-index:4200;width:266px;max-height:calc(100vh - 20px);overflow:auto;padding:12px;background:#fff;border:1px solid #b9c9df;border-radius:12px;box-shadow:0 12px 35px #1b2e4966;color:#263649;font-size:12px}
  .color-palette-title{font-weight:800;margin-bottom:9px;color:#30415a}
  .color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
  .color-choice{aspect-ratio:1/1;min-width:0;padding:0;border:1px solid #9aa8ba;border-radius:5px;background:var(--choice-color);cursor:pointer;box-shadow:inset 0 0 0 1px #fff8;position:relative}
  .color-choice:hover,.color-choice:focus-visible{outline:2px solid #1874cf;outline-offset:2px}
  .color-choice[aria-pressed="true"]::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:#fff;text-shadow:0 1px 3px #000c}
  .color-choice[data-light="true"][aria-pressed="true"]::after{color:#19283b;text-shadow:0 1px 2px #fff}
  .color-palette-more{width:100%;border:1px solid #d1dce8;border-radius:7px;background:#f7f9fc;padding:8px;display:flex;align-items:center;justify-content:space-between;color:#31425a;font-size:12px;cursor:pointer}
  .color-palette-more:hover{background:#ecf4fd;border-color:#a3c8f2}
  .color-advanced{display:flex;align-items:center;gap:7px;border-top:1px solid #e1e8f1;margin-top:10px;padding-top:10px}
  .color-advanced input[type="color"]{width:41px;height:34px;padding:2px;border:1px solid #aebed2;border-radius:5px;background:#fff;cursor:pointer}
  .color-advanced input[type="text"]{width:89px;min-width:0;height:33px;border:1px solid #cbd6e4;border-radius:5px;padding:3px 6px;font-size:12px;color:#203044;font-family:monospace}
  .color-advanced button{height:33px;padding:0 10px;background:#eaf3ff;border:1px solid #a4c7f4;border-radius:5px;color:#145ca8;font-weight:700;cursor:pointer}
  .color-palette-help{font-size:11px;color:#748299;margin-top:8px}
  .quick-text-toolbar {position:fixed;display:flex;align-items:center;gap:8px;z-index:4100;background:#ffffff;border:1px solid #b6cce5;border-radius:9px;box-shadow:0 8px 25px #13294340;padding:7px 10px;white-space:nowrap;color:#263649;font-size:12px}

  /* v0.76: floating formatting bar can be repositioned without changing text selection. */
  .quick-text-toolbar .quick-drag-handle{align-self:stretch;flex:0 0 25px;min-width:25px;display:flex;align-items:center;justify-content:center;position:sticky;left:0;z-index:2;border:1px solid #b6cce5;border-radius:6px;background:#edf5ff;color:#356390;font-size:18px;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
  .quick-text-toolbar .quick-drag-handle:active{cursor:grabbing;background:#dceaff}
  .quick-text-toolbar .quick-drag-handle:hover{background:#dfedff;border-color:#82addc}
  .quick-text-toolbar .quick-drag-handle:focus-visible{outline:2px solid #2680ed;outline-offset:2px}
  .quick-text-toolbar .quick-label{font-weight:800;color:#1657a4;border-right:1px solid #dce5f0;padding-right:9px}
  .quick-text-toolbar label{font-weight:700;color:#52627a}
  .quick-text-toolbar input[type="number"]{width:62px;height:31px;padding:4px 5px;border:1px solid #bdcbe0;border-radius:6px;color:#213044;text-align:center}
  .quick-text-toolbar input[type="color"]{width:41px;height:31px;padding:2px;border:1px solid #bdcbe0;border-radius:6px;background:white;cursor:pointer}
  .quick-text-toolbar .quick-help{font-size:11px;color:#77879c}
  .quick-text-toolbar {max-width:calc(100vw - 14px);overflow-x:auto}
  .quick-text-toolbar select {height:31px;max-width:152px;min-width:118px;padding:3px 7px;border:1px solid #bdcbe0;border-radius:6px;background:#fff;color:#213044;font-size:12px;cursor:pointer}
  .quick-text-toolbar .font-picker-label {font-weight:700;color:#52627a}
  .quick-text-toolbar .quick-format-btn {height:31px;min-width:34px;border:1px solid #bdcbe0;border-radius:6px;background:#fff;color:#243246;font-weight:800;cursor:pointer}
  .quick-text-toolbar .quick-format-btn:hover {background:#eaf2ff;border-color:#7aa9df}
  .quick-text-toolbar .quick-format-btn[aria-pressed="true"] {background:#d9eaff;border-color:#2878cc;color:#1052a0}
  @media(max-width:600px){.quick-text-toolbar{gap:5px;padding:5px 7px}.quick-text-toolbar .quick-help{display:none}}

.layout-studio.is-active>.workarea{grid-area:center;min-width:0;min-height:0;overflow:auto}
.layout-studio.is-active>.layout-slot{padding:14px 12px;display:flex;flex-direction:column;
 background:var(--layout-bg,#eef4fa);color:#334864;border:1px dashed #9db6d2;min-width:0;min-height:0;
 box-shadow:inset 0 0 0 2px #fff6;white-space:pre-wrap;word-break:break-word;font-size:12px;cursor:pointer}
.layout-studio.is-active>.layout-slot:hover{border-color:#2479e5;background:#e9f3ff}
.layout-studio.is-active>.layout-slot:focus-visible{outline:3px solid #2875e8;outline-offset:-3px}
.layout-studio.is-active>.layout-slot.layout-slot-left{grid-area:left}
.layout-studio.is-active>.layout-slot.layout-slot-right{grid-area:right}
.layout-studio.is-active>.layout-slot.layout-slot-top{grid-area:top}
.layout-studio.is-active>.layout-slot.layout-slot-bottom{grid-area:bottom}
.layout-studio.is-active>.layout-slot.is-absent{display:none}
.layout-slot .layout-slot-name{font-size:11px;font-weight:800;letter-spacing:.02em;flex:none;color:#3870a6;margin-bottom:12px}
.layout-slot .layout-slot-body{line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
.layout-slot .layout-slot-body.placeholder{opacity:.56;font-style:italic}
.layout-studio.is-active>.layout-slot.scroll-independent{overflow-y:auto}
.layout-studio.is-active>.layout-slot.scroll-none{overflow:hidden}
.layout-panel .layout-presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 18px}
.layout-panel .layout-preset{background:#fafcfe;border:1px solid #d6e1ee;border-radius:9px;padding:8px 6px;min-height:93px;display:flex;align-items:center;flex-direction:column;gap:7px;color:#354b67;font-size:11px;font-weight:650}
.layout-panel .layout-preset:hover{background:#f1f7ff;border-color:#8eb9ec}
.layout-panel .layout-preset.active{background:#eaf3ff;border:2px solid #2479e5;color:#155aa3;padding:7px 5px}
.layout-mini{display:grid;gap:2px;width:100%;height:45px;max-width:110px;grid-template-areas:"a a a" "b c d" "e e e";grid-template-columns:25% minmax(0,1fr) 25%;grid-template-rows:9px 1fr 9px}
.layout-mini i{border-radius:2px;background:#d9e4f2;display:block}
.layout-mini .m-a{grid-area:a}.layout-mini .m-b{grid-area:b}.layout-mini .m-c{grid-area:c;background:#93b7de}.layout-mini .m-d{grid-area:d}.layout-mini .m-e{grid-area:e}
.layout-mini [data-hidden="true"]{opacity:.11}
.layout-panel .layout-group{border-top:1px solid #e0e8f2;padding-top:15px;margin-top:16px}
.layout-panel .layout-label{font-size:12px;font-weight:750;color:#304964;margin-bottom:7px}
.layout-panel .layout-field{display:flex;flex-direction:column;gap:5px;margin:10px 0;font-size:11px;color:#4b5e75}
.layout-panel .layout-field>span{font-weight:700}
.layout-panel .layout-field input,.layout-panel .layout-field textarea,.layout-panel .layout-field select{width:100%;border:1px solid #cbd8e7;border-radius:7px;background:#fff;padding:8px;color:#26394e;font-size:12px}
.layout-panel .layout-field textarea{min-height:62px;resize:vertical;line-height:1.5}
.layout-panel .layout-note{font-size:11px;line-height:1.65;color:#6b7b90;margin:10px 0}
.layout-panel .layout-preview-caption{background:#f2f6fb;border-radius:7px;padding:9px;font-size:11px;color:#506780;line-height:1.6}
@media(max-width:800px){.shell>.layout-studio{height:100%}}


/* v0.69: a shared header across every page layout */
.dock-tab.dock-settings{flex:0 0 39px;font-size:20px;line-height:1;padding:5px}
.layout-header-entry{margin:4px 0 18px;padding:12px;border:1px solid #cedeee;background:#f4f8ff;border-radius:9px;color:#29435f}
.layout-header-entry strong{font-size:13px}
.layout-header-entry .layout-note{margin:6px 0 10px}
.layout-studio.is-active>.site-header-editor{
  grid-area:siteheader;position:relative!important;top:auto!important;left:auto!important;right:auto!important;
  width:100%!important;min-width:0;z-index:120;max-width:none;
}
.layout-studio.is-active>.site-header-editor.is-overlay-scroll{
  background-color:#192438; /* overridden from project.header.background by JS */
}
.layout-studio.is-active>.site-header-editor.hidden{display:none}
.layout-studio.is-active .header-editor-measure{right:28px}

/* v0.70: editable regions share the complete standard part editor. */
.layout-studio.is-active>.workarea{padding-top:0!important;padding-bottom:0!important}
.layout-studio.is-active>.workarea>.stage{margin-top:0!important}
.region-focus-bar{position:sticky;top:0;z-index:110;display:flex;align-items:center;justify-content:space-between;gap:9px;padding:8px 13px;background:#dbeafb;border-bottom:1px solid #9ac1ec;color:#1c4f8c;font-size:12px;font-weight:750}
.region-focus-bar[hidden]{display:none!important}
.region-focus-bar button{flex:none;background:#fff;color:#1159a6;border:1px solid #9dbbe1;border-radius:6px;font-size:11px;padding:6px 10px;cursor:pointer}
.layout-region-switch{padding:10px 9px;margin:14px 0;border:1px solid #bed6f2;border-radius:9px;background:#f0f7ff;display:flex;flex-wrap:wrap;gap:7px}
.layout-region-switch .layout-label{width:100%}
.layout-region-switch button{font-size:11px;padding:7px 9px;background:#fff;border:1px solid #cbd9eb;border-radius:6px;color:#24547e;cursor:pointer}
.layout-region-switch button.active{background:#2173d1;color:#fff;border-color:#2173d1}
.layout-studio.is-active>.layout-slot{position:relative;padding:0!important;overflow:auto}
.layout-studio.is-active>.layout-slot .layout-slot-name{position:sticky;top:0;z-index:9;display:block;padding:7px 9px;margin:0;background:#ecf5ff;border-bottom:1px solid #adc8e6;cursor:pointer}
.layout-studio.is-active>.layout-slot.layout-focused .layout-slot-name{background:#246fca;color:#fff}
.layout-slot .layout-slot-body{padding:7px 9px;font-size:12px;position:relative;z-index:1;pointer-events:none}
.layout-region-parts{position:relative;width:100%;min-height:100%;pointer-events:none}
.layout-mini-part{position:absolute;display:block;overflow:hidden;box-sizing:border-box;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25;padding:2px;box-shadow:0 1px 3px #0002;pointer-events:auto;cursor:pointer}
.layout-mini-part:hover{outline:2px solid #2479e5}

  /* v0.85 — Focused canvas tools. All editing properties remain in the 詳細 inspector. */
  .msb-toolbar-internals{display:none!important}
  .quick-text-toolbar.msb-compact-toolbar{gap:7px;padding:5px 7px;max-width:calc(100vw - 14px);box-shadow:0 5px 17px #142e4c22}
  .quick-text-toolbar.msb-compact-toolbar .quick-label{min-width:36px;padding:0 7px 0 2px}
  .quick-text-toolbar.msb-compact-toolbar .qb-secondary{height:32px;min-width:64px;border:1px solid #c0d0e4;border-radius:7px;padding:4px 9px;background:#fff;color:#274466;font:inherit;font-weight:700;cursor:pointer}
  .quick-text-toolbar.msb-compact-toolbar .qb-secondary:hover{background:#eaf3ff;border-color:#7baded}
  .quick-text-toolbar.msb-compact-toolbar .qb-strong{background:#e9f3ff;color:#1458a4;border-color:#b1cff1}
  .quick-object-toolbar.msb-object-compact{gap:6px;padding:5px 7px;box-shadow:0 5px 17px #142e4c22}
  .quick-object-toolbar.msb-object-compact strong{padding:0 9px 0 4px}
  .quick-object-toolbar.msb-object-compact button{height:32px;padding:4px 10px;font-size:12px;font-weight:700}
  .part-detail-window #inspector details.msb-group{margin:10px 0 13px}
  .part-detail-window #inspector details.msb-group > summary{cursor:pointer;user-select:none}
  .part-detail-window #inspector details.msb-group > .msb-group-content{padding-top:12px}
  .part-detail-window #inspector .inspector-text-mode.is-partial{margin-top:2px!important}
  .part-detail-window #inspector .inspector-text-mode:not(.is-partial){display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-full">morhirc Site Builder</span><span class="brand-short" aria-hidden="true">m</span><span class="version">v0.85 - ローカル編集</span></div>
  <input id="projectName" class="project-name" value="新しいサイト" title="サイト名" aria-label="サイト名">
  <button id="newBtn" class="hide-narrow" title="新しい白紙サイト">新規</button>
  <button id="undoBtn" title="元に戻す Ctrl+Z">↶</button>
  <button id="redoBtn" title="やり直す Ctrl+Y">↷</button>
  <button id="loadBtn" class="hide-narrow" title="保存したJSONを開く">開く</button>
  <button type="button" id="gridOverlayBtn" class="top-grid-btn" aria-pressed="false" title="編集画面に20px方眼と中央ガイドを重ねます。公開HTMLには出力しません">▦ グリッド</button>
  <div class="top-responsive" aria-label="編集する端末と自動調整">
    <div class="device" role="group" aria-label="編集中の端末">
      <button data-view="desktop" class="active" title="PCレイアウトを編集">PC</button>
      <button data-view="tablet" title="タブレットの縦・横を切り替えて編集">タブレット</button>
      <button data-view="mobile" title="スマホのレイアウトを編集">スマホ</button>
    </div>
    <div class="tablet-orientation hidden" id="tabletOrientationPicker" role="group" aria-label="タブレットの向き">
      <button type="button" data-orientation="tablet" title="縦向き：スマホ版を自動反映">縦</button>
      <button type="button" data-orientation="tabletLandscape" title="横向き：PC版を自動反映">横</button>
    </div>
    <label for="responsiveModeSelect" id="responsiveModeCaption" class="responsive-mode-caption hidden">編集方式</label>
    <select id="responsiveModeSelect" class="responsive-mode-select hidden" aria-label="この端末の編集方式" title="自動連動と個別編集を切り替えます。個別編集の配置は保存され、再び戻せます">
      <option value="auto">自動連動</option>
      <option value="manual">個別編集</option>
    </select>
  </div>
  <div class="top-zoom" role="group" aria-label="編集キャンバスの表示倍率">
    <label for="editorZoomMode">倍率</label>
      <select id="editorZoomMode" title="キャンバスだけの拡大・縮小。公開するHTMLには影響しません">
        <option value="fit">画面に収める</option>
        <option value="published">公開サイズ</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="1.75">175%</option>
        <option value="2">200%</option>
      </select>
    <span id="editorZoomInfo" class="top-zoom-note" aria-live="polite">100%</span>
  </div>
  <div class="spacer"></div>
  <button id="previewBtn">プレビュー</button>
  <button id="saveBtn" class="hide-narrow" title="あとから編集するためのJSONデータを保存">編集保存</button>
  <button id="exportBtn" class="primary">サイトを書き出す</button>
  <div class="top-panel-controls" role="group" aria-label="編集パネル">
    <button id="toggleDockPanel" type="button" aria-pressed="true" aria-controls="editorDock" title="右側の編集パネルを手動で開閉します。パーツを選択しても勝手に開きません">パネルを閉じる</button>
  </div>
  <button id="helpBtn" title="使い方">?</button>
</header>
<div class="shell" id="editorShell">
  <div class="layout-studio" id="layoutStudio">
    <div id="layoutTopSlot" class="layout-slot layout-slot-top" role="button" tabindex="0" aria-label="上部レイアウト領域を編集"></div>
    <div id="layoutLeftSlot" class="layout-slot layout-slot-left" role="button" tabindex="0" aria-label="左側レイアウト領域を編集"></div>
    <main class="workarea" id="workarea">
    <div class="region-focus-bar" id="regionFocusBar" hidden><span id="regionFocusTitle"></span><button type="button" id="regionFocusBack">本文の編集に戻る</button></div>
    <span id="stageNote" class="stage-note" hidden></span>
    <div class="stage"><div class="site-artboard" id="siteArtboard"><div class="site-header-editor hidden" id="siteHeaderEditor" role="button" tabindex="0" aria-label="共通ヘッダーの設定"></div><div class="paper" id="paper" aria-label="編集キャンバス"></div></div></div>
    </main>
    <div id="layoutRightSlot" class="layout-slot layout-slot-right" role="button" tabindex="0" aria-label="右側レイアウト領域を編集"></div>
    <div id="layoutBottomSlot" class="layout-slot layout-slot-bottom" role="button" tabindex="0" aria-label="下部レイアウト領域を編集"></div>
  </div>
  <aside class="editor-dock" id="editorDock" data-mode="tools" aria-label="編集パネル">
    <div class="dock-head" role="group" aria-label="編集項目">
      <button id="dockTabTools" type="button" class="dock-tab active" aria-pressed="true" aria-controls="toolsPanel">パーツ</button>
      <button id="dockTabPages" type="button" class="dock-tab" aria-pressed="false" aria-controls="pagesPanel">ページ</button>
      <button id="dockTabLayout" type="button" class="dock-tab" aria-pressed="false" aria-controls="layoutPanel">レイアウト</button>
      <button id="dockTabProps" type="button" class="dock-tab dock-settings" aria-label="サイト設定" title="サイト設定" aria-pressed="false" aria-controls="siteSettingsPanel">⚙</button>
      <button id="dockHintsToggle" type="button" class="dock-hints-toggle" aria-label="説明文を表示" title="説明文の表示・非表示" aria-pressed="false">?</button>
      <button id="dockClose" type="button" class="dock-close" aria-label="右側のパネルを閉じる" title="パネルを閉じる">×</button>
    </div>
  <div class="sidebar" id="toolsPanel">
    <div class="section-head">パーツを追加</div>
    <div class="add-position"><label for="addPlacement">追加位置</label><select id="addPlacement" aria-label="パーツの追加位置"><option value="visible">今見えている場所</option><option value="point">クリックして指定</option></select></div>
    <div class="catalog-basic-heading">基本</div>
    <div class="elements catalog-basic">
      <button class="element-add" data-add="heading" title="見出しを追加"><span class="glyph">H</span><span>見出し</span></button>
      <button class="element-add" data-add="text" title="文章を追加"><span class="glyph">T</span><span>文章</span></button>
      <button class="element-add" data-add="image" title="画像を追加"><span class="glyph">▣</span><span>画像</span></button>
      <button class="element-add" data-add="button" title="標準ボタンを追加"><span class="glyph">▭</span><span>ボタン</span></button>
      <button class="element-add" data-add="box" title="四角形を追加"><span class="glyph">□</span><span>図形</span></button>
      <button class="element-add" data-add="line" title="線を追加"><span class="glyph">—</span><span>線</span></button>
    </div>
    <details class="catalog-group" data-category="layout" open>
      <summary>レイアウト <span class="catalog-chevron" aria-hidden="true">⌄</span></summary>
      <div class="catalog-picks">
        <button type="button" class="catalog-pick layout-open-shortcut" id="openLayoutDesign"><span class="catalog-icon">▦</span><strong>画面レイアウトを編集</strong></button>
        <button class="catalog-pick" data-add="menu" title="クリック・ホバーで展開するボタンメニュー"><span class="catalog-icon">☰</span>ボタンメニュー</button>
        <button class="catalog-pick" data-add="sidebar" title="細いバーから横に広がる独立したサイドバー"><span class="catalog-icon">▤</span>画面端サイドバー</button>
        <button class="catalog-pick" data-add="preset-card" title="文章を編集できるカードを配置"><span class="catalog-icon">▤</span>カード</button>
        <button class="catalog-pick" data-add="preset-frame" title="透明な囲み枠を配置"><span class="catalog-icon">▢</span>囲み枠</button>
        <button class="catalog-pick" data-add="preset-callout" title="背景付きの説明ボックスを配置"><span class="catalog-icon">▣</span>案内ボックス</button>
        <button class="catalog-pick" data-add="preset-label" title="短い文字のラベルを配置"><span class="catalog-icon">▱</span>ラベル</button>
      </div>
    </details>
    <details class="catalog-group" data-category="design">
      <summary>デザイン・図形 <span class="catalog-chevron" aria-hidden="true">⌄</span></summary>
      <div class="catalog-picks">
        <button class="catalog-pick" data-add="preset-circle" title="円形を配置"><span class="catalog-icon">○</span>円形</button>
        <button class="catalog-pick" data-add="preset-rounded" title="角丸図形を配置"><span class="catalog-icon">▢</span>角丸四角形</button>
        <button class="catalog-pick" data-add="preset-pill-button" title="丸みの強いボタンを配置"><span class="catalog-icon">▭</span>丸ボタン</button>
        <button class="catalog-pick" data-add="preset-outline-button" title="枠線付きボタンを配置"><span class="catalog-icon">▯</span>枠線ボタン</button>
        <button class="catalog-pick" data-add="preset-divider" title="薄い区切り線を配置"><span class="catalog-icon">─</span>区切り線</button>
      </div>
    </details>
    <details class="catalog-group" data-category="media">
      <summary>メディア・埋め込み <span class="catalog-chevron" aria-hidden="true">⌄</span></summary>
      <div class="catalog-picks">
        <button class="catalog-pick" data-add="video" title="動画を追加"><span class="catalog-icon">▶</span>動画</button>
        <button class="catalog-pick" data-add="pdf" title="PDFをページ内に表示"><span class="catalog-icon">PDF</span>PDF表示</button>
        <button class="catalog-pick" data-add="form" title="Googleフォームを埋め込む"><span class="catalog-icon">✉</span>Googleフォーム</button>
      </div>
    </details>

  </div>
  <div class="sidebar page-sidebar" id="pagesPanel">
    <div class="section-head">ページ <button id="addPageBtn" class="small-btn">＋ 追加</button></div>
    <div id="pageList" class="pages"></div>
  </div>
  <div class="sidebar layout-panel" id="layoutPanel"></div>
  <div class="sidebar inspector" id="inspector"></div>
  <div class="sidebar inspector" id="siteSettingsPanel"></div>
  </aside>
</div>
<input type="file" accept="application/json,.json" id="openFile" class="hidden">
<input type="file" accept="image/*" id="imageFile" class="hidden">
<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="hoverSwapImageFile" class="hidden">
<input type="file" id="headerLogoFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="faviconFile" accept=".ico,image/x-icon,image/vnd.microsoft.icon,image/png,image/jpeg,image/webp,image/gif" hidden>
  <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" id="pageBgFile" class="hidden">
<div id="quickTextToolbar" class="quick-text-toolbar msb-compact-toolbar hidden" role="toolbar" aria-label="文字の編集">
  <button type="button" id="quickToolbarDrag" class="quick-drag-handle" title="バーを移動（ダブルクリックで位置を戻す）" aria-label="ツールバーの移動">⠿</button>
  <span class="quick-label" id="quickToolbarMode">文字</span>
  <button type="button" class="qb-secondary msb-text-action" data-quick-action="editText" title="文字を直接編集" aria-label="文字を編集">✎ <span id="msbTextActionLabel">編集</span></button>
  <button type="button" class="qb-secondary qb-strong" data-quick-action="details" title="文字・色・書式などの詳細設定" aria-label="詳細設定を開く">⚙ <span>詳細</span></button>
  <!-- Core formatting controls remain available to the editor script. The visible controls live in 詳細. -->
  <div class="msb-toolbar-internals" aria-hidden="true">
    <label for="quickFontFamily">フォント</label><select id="quickFontFamily" aria-label="フォント"></select>
    <label for="quickFontSize">サイズ</label><input id="quickFontSize" type="number" min="8" max="144" step="1" value="12">
    <span class="quick-help">px</span>
    <label for="quickTextColor-trigger">色</label><div class="color-control compact"><input id="quickTextColor" class="color-value" type="color" value="#ffeb00" tabindex="-1"><button id="quickTextColor-trigger" type="button" class="color-trigger" data-color-for="quickTextColor" style="--current-color:#ffeb00"><span class="color-chip"></span><span class="color-code">#FFEB00</span><span class="color-arrow">⌄</span></button></div>
    <button type="button" id="quickBold" class="quick-format-btn"><b>B</b></button>
    <button type="button" id="quickUnderline" class="quick-format-btn"><u>U</u></button>
    <span id="quickToolbarHint" class="quick-help"></span>
    <input id="quickTextBg" class="qb-textbg" type="color" aria-label="背景色">
  </div>
</div>
<div id="quickPartToolbar" class="quick-object-toolbar hidden" role="toolbar" aria-label="選択したパーツの編集"></div>
<div id="partDetailWindow" class="part-detail-window hidden" role="dialog" aria-label="パーツの詳細設定">
  <div class="part-detail-heading" id="partDetailDrag" title="ドラッグして移動"><span class="drag-hint" aria-hidden="true">⠿</span><span id="partDetailTitle">パーツの詳細設定</span><button id="partDetailClose" type="button" aria-label="詳細設定を閉じる">×</button></div>
  <div id="partDetailMount"></div>
</div>
<div id="partContextMenu" class="part-context-menu hidden" role="menu" aria-label="パーツ操作">
  <button type="button" data-part-action="copy" role="menuitem">コピー</button>
  <button type="button" data-part-action="cut" role="menuitem">切り取り</button>
  <button type="button" data-part-action="paste" role="menuitem">貼り付け</button>
  <button type="button" data-part-action="duplicate" role="menuitem">複製</button>
  <div class="context-divider" role="separator"></div>
  <button type="button" data-part-action="front" role="menuitem">最前面へ移動</button>
  <button type="button" data-part-action="back" role="menuitem">最背面へ移動</button>
  <div class="context-divider" role="separator"></div>
  <button type="button" data-part-action="delete" role="menuitem" class="danger-action">削除</button>
</div>

<script>
'use strict';
(() => {
 const $ = id => document.getElementById(id);
 const WIDTH = {desktop:1000,tablet:720,tabletLandscape:1024,mobile:390};

 // v0.38: selectable effects. Effects are shared across all devices and embedded in project JSON.
 const FX_SPEC={
   hover:{label:'ホバー',choices:[['none','なし'],['lift','浮き上がる'],['zoom','拡大'],['shadow','影が出る'],['tilt','傾く'],['tint','明るくなる']]},
   enter:{label:'登場',choices:[['none','なし'],['fade','フェード'],['up','下から'],['left','左から'],['zoom','ズーム'],['blur','ぼかし解除']]},
   click:{label:'クリック',choices:[['none','なし'],['pop','弾む'],['shake','揺れる'],['flip','回転'],['pulse','押し込む']]},
   loop:{label:'常時',choices:[['none','なし'],['float','浮遊'],['pulse','伸縮'],['spin','回転'],['sway','ゆらゆら'],['glow','光る']]}
 };
 const FX_KEYS={hover:'fxHover',enter:'fxEnter',click:'fxClick',loop:'fxLoop'};
 let fxActiveCategory='hover',fxPanelOpen=true;
 function fxType(e,cat){
   const stored=e[FX_KEYS[cat]];
   if(stored===undefined||stored===null|| (cat==='hover'&&stored==='none'&&e.hoverLift)){if(cat==='hover'&&e.hoverLift)return 'lift';return 'none'}
   return FX_SPEC[cat].choices.some(([v])=>v===stored)?stored:'none';
 }
 function fxClassList(e){
   const a=['fx-part'];
   for(const [category,short] of [['hover','h'],['enter','e'],['click','c'],['loop','l']]){
     const type=fxType(e,category);if(type!=='none')a.push(`fx-${short}-${type}`);
   }
   return a.join(' ');
 }
 function fxVariables(e){const sp=[.6,1,1.5].includes(Number(e.fxSpeed))?Number(e.fxSpeed):1;const de=[0,.3,.7,1.2].includes(Number(e.fxDelay))?Number(e.fxDelay):0;return `--fx-speed:${sp};--fx-delay:${de}s;`}
 function fxPanelHTML(e){
   const categories=Object.keys(FX_SPEC).filter(k=>k!=='click'||!['video','pdf','form'].includes(e.type));
   if(!categories.includes(fxActiveCategory))fxActiveCategory=categories[0];
   const category=fxActiveCategory,current=fxType(e,category);
   const tabs=categories.map(k=>`<button type="button" class="fx-category${category===k?' active':''}" data-fx-tab="${k}" aria-pressed="${category===k}">${FX_SPEC[k].label}</button>`).join('');
   const gallery=FX_SPEC[category].choices.map(([v,name])=>`<button type="button" class="fx-sample fx-demo-${category}-${v}" data-fx-option="${v}" aria-pressed="${current===v}" title="${name}"><span class="fx-demo-space"><span class="fx-demo-object" aria-hidden="true"></span></span><span class="fx-demo-name">${name}</span></button>`).join('');
   const speed=[['0.6','速い'],['1','標準'],['1.5','ゆっくり']].map(([v,l])=>`<option value="${v}"${Number(e.fxSpeed||1)===Number(v)?' selected':''}>${l}</option>`).join('');
   const delay=[['0','すぐ'],['0.3','0.3秒'],['0.7','0.7秒'],['1.2','1.2秒']].map(([v,l])=>`<option value="${v}"${Number(e.fxDelay||0)===Number(v)?' selected':''}>${l}</option>`).join('');
   return `<details class="fx-settings" id="fxSettings"${fxPanelOpen?' open':''}><summary>動き・効果</summary><div class="fx-inner"><div class="fx-categories">${tabs}</div><div class="fx-gallery">${gallery}</div><div class="fx-params"><div><label for="fxSpeedSelect">速度</label><select id="fxSpeedSelect">${speed}</select></div><div><label for="fxDelaySelect">登場の遅延</label><select id="fxDelaySelect">${delay}</select></div></div><button class="fx-test" id="fxTest" type="button">▶ キャンバスで試す</button><div class="fx-tip-field"><label for="fxTooltip">ホバー時の説明（任意）</label><input id="fxTooltip" value="${attr(e.hoverText||'')}" placeholder="表示しない"></div></div></details>`;
 }
 function fxReplay(target,cls='fx-fired'){
   if(!target)return;target.classList.remove(cls);void target.offsetWidth;target.classList.add(cls);
   const node=target.querySelector('.content,.item-body,.fx-demo-object');
   if(node){node.addEventListener('animationend',()=>target.classList.remove(cls),{once:true});}

 }
 function fxTestEntrance(el){
   if(!el || ![...el.classList].some(name=>name.startsWith('fx-e-')))return;
   el.classList.remove('fx-test-enter','fx-enter-show');
   // Force the entrance animation to start again, even for an already selected part.
   void el.offsetWidth;
   el.classList.add('fx-test-enter');
   requestAnimationFrame(()=>{if(el.isConnected)el.classList.add('fx-enter-show')});
   const speed=Number(el.style.getPropertyValue('--fx-speed'))||1;
   const delay=parseFloat(el.style.getPropertyValue('--fx-delay'))||0;
   // Remove test class after the animation is complete, not during a canvas re-render.
   setTimeout(()=>{if(el.isConnected)el.classList.remove('fx-test-enter')},Math.ceil((.85*speed+delay)*1000)+350);
 }
 function fxDemoHover(el){
   if(!el)return;
   el.classList.remove('fx-demo-trigger');

 function wireFxPanel(e){
   const panel=$('fxSettings');if(!panel)return;
   panel.addEventListener('toggle',()=>{fxPanelOpen=panel.open});

     if(fxActiveCategory==='enter')fxTestEntrance(document.querySelector('.element[data-id="'+e.id+'"]'));
   });
   panel.querySelectorAll('[data-fx-option]').forEach(btn=>btn.onclick=()=>{
     const key=FX_KEYS[fxActiveCategory];const value=btn.dataset.fxOption;

     if(active && value!=='none'){
       if(fxActiveCategory==='enter')fxTestEntrance(active);
       else if(fxActiveCategory==='click')fxReplay(active);
       else if(fxActiveCategory==='hover')fxDemoHover(active);
     }
   });
   const speed=$('fxSpeedSelect'),delay=$('fxDelaySelect');
   speed.onchange=()=>{mutate(()=>e.fxSpeed=Number(speed.value));if(fxActiveCategory==='enter')fxTestEntrance(document.querySelector('.element[data-id="'+e.id+'"]'));};
   delay.onchange=()=>{mutate(()=>e.fxDelay=Number(delay.value));if(fxActiveCategory==='enter')fxTestEntrance(document.querySelector('.element[data-id="'+e.id+'"]'));};

   $('fxTest').onclick=()=>{
     const el=[...document.querySelectorAll('.element')].find(n=>n.dataset.id===e.id);
     if(!el)return;
     if(fxActiveCategory==='enter')fxTestEntrance(el);
     else if(fxActiveCategory==='click')fxReplay(el);
     else if(fxActiveCategory==='hover')fxDemoHover(el);
     else if(fxActiveCategory==='loop'){
       const body=el.querySelector('.fx-motion-loop');
       if(body){body.style.animation='none';void body.offsetWidth;body.style.removeProperty('animation')}
     }
   };
 }

 const FX_PUBLIC_CSS="\n/* v0.40 effects: explicit user-selected effects run in editor and published HTML */\n.fx-motion-enter,.fx-motion-loop{height:100%;width:100%;position:relative}\n.fx-part>:is(.fx-motion-enter)>.fx-motion-loop>:is(.content,.item-body){transition:transform calc(.32s * var(--fx-speed,1)) ease,box-shadow calc(.32s * var(--fx-speed,1)) ease,filter calc(.32s * var(--fx-speed,1)) ease,opacity calc(.32s * var(--fx-speed,1)) ease,background-color calc(.32s * var(--fx-speed,1)) ease}\n.fx-h-lift:hover .content,.fx-h-lift:hover .item-body{transform:translateY(-6px);box-shadow:0 12px 24px #172d4d45}\n.fx-h-zoom:hover .content,.fx-h-zoom:hover .item-body{transform:scale(1.065)}\n.fx-h-shadow:hover .content,.fx-h-shadow:hover .item-body{box-shadow:0 15px 28px #182c4c70}\n.fx-h-tilt:hover .content,.fx-h-tilt:hover .item-body{transform:rotate(-3deg)}\n.fx-h-tint:hover .content,.fx-h-tint:hover .item-body{filter:brightness(1.15) saturate(1.25)}\n.fx-v-soft .content,.fx-v-soft .item-body{box-shadow:0 5px 13px #152b4933}\n.fx-v-deep .content,.fx-v-deep .item-body{box-shadow:0 12px 28px #10223f65}\n.fx-v-glow .content,.fx-v-glow .item-body{box-shadow:0 0 0 2px #5295ee91,0 0 22px #519de99e}\n.fx-v-glass .content,.fx-v-glass .item-body{backdrop-filter:blur(8px) saturate(125%);-webkit-backdrop-filter:blur(8px) saturate(125%);box-shadow:inset 0 0 0 1px #ffffff75,0 6px 20px #11254721}\n.fx-v-gray .content,.fx-v-gray .item-body{filter:grayscale(1)}\n@keyframes fxFade{from{opacity:0}to{opacity:1}}\n@keyframes fxUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}\n@keyframes fxLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}\n@keyframes fxZoom{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}\n@keyframes fxBlur{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}\n@keyframes fxPop{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}\n@keyframes fxShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}\n@keyframes fxFlip{0%{transform:perspective(450px) rotateY(0)}50%{transform:perspective(450px) rotateY(90deg)}100%{transform:perspective(450px) rotateY(360deg)}}\n@keyframes fxTapPulse{0%{transform:scale(1)}40%{transform:scale(.91)}75%{transform:scale(1.08)}100%{transform:scale(1)}}\n@keyframes fxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}\n@keyframes fxBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.065)}}\n@keyframes fxSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n@keyframes fxSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}\n@keyframes fxGlow{0%,100%{filter:drop-shadow(0 0 0 #3685f000)}50%{filter:drop-shadow(0 0 9px #3685f0b0)}}\n.fx-e-fade.fx-enter-show>.fx-motion-enter{animation:fxFade calc(.75s * var(--fx-speed,1)) both ease-out;animation-delay:var(--fx-delay,0s)}\n.fx-e-up.fx-enter-show>.fx-motion-enter{animation:fxUp calc(.75s * var(--fx-speed,1)) both ease-out;animation-delay:var(--fx-delay,0s)}\n.fx-e-left.fx-enter-show>.fx-motion-enter{animation:fxLeft calc(.75s * var(--fx-speed,1)) both ease-out;animation-delay:var(--fx-delay,0s)}\n.fx-e-zoom.fx-enter-show>.fx-motion-enter{animation:fxZoom calc(.75s * var(--fx-speed,1)) both ease-out;animation-delay:var(--fx-delay,0s)}\n.fx-e-blur.fx-enter-show>.fx-motion-enter{animation:fxBlur calc(.8s * var(--fx-speed,1)) both ease-out;animation-delay:var(--fx-delay,0s)}\n.fx-enter-ready:not(.fx-enter-show)>.fx-motion-enter{opacity:0}\n.fx-l-float>.fx-motion-enter>.fx-motion-loop{animation:fxFloat calc(3.1s * var(--fx-speed,1)) ease-in-out infinite}\n.fx-l-pulse>.fx-motion-enter>.fx-motion-loop{animation:fxBreath calc(2.5s * var(--fx-speed,1)) ease-in-out infinite}\n.fx-l-spin>.fx-motion-enter>.fx-motion-loop{animation:fxSpin calc(6s * var(--fx-speed,1)) linear infinite}\n.fx-l-sway>.fx-motion-enter>.fx-motion-loop{animation:fxSway calc(2.5s * var(--fx-speed,1)) ease-in-out infinite}\n.fx-l-glow>.fx-motion-enter>.fx-motion-loop{animation:fxGlow calc(2.5s * var(--fx-speed,1)) ease-in-out infinite}\n.fx-c-pop.fx-fired .content,.fx-c-pop.fx-fired .item-body{animation:fxPop calc(.45s * var(--fx-speed,1)) ease-out}\n.fx-c-shake.fx-fired .content,.fx-c-shake.fx-fired .item-body{animation:fxShake calc(.55s * var(--fx-speed,1)) ease-out}\n.fx-c-flip.fx-fired .content,.fx-c-flip.fx-fired .item-body{animation:fxFlip calc(.7s * var(--fx-speed,1)) ease-in-out}\n.fx-c-pulse.fx-fired .content,.fx-c-pulse.fx-fired .item-body{animation:fxTapPulse calc(.45s * var(--fx-speed,1)) ease-out}\n\n.fx-demo-trigger.fx-h-lift .content{transform:translateY(-6px);box-shadow:0 12px 24px #172d4d45}\n.fx-demo-trigger.fx-h-zoom .content{transform:scale(1.065)}\n.fx-demo-trigger.fx-h-shadow .content{box-shadow:0 15px 28px #182c4c70}\n.fx-demo-trigger.fx-h-tilt .content{transform:rotate(-3deg)}\n.fx-demo-trigger.fx-h-tint .content{filter:brightness(1.15) saturate(1.25)}\n\n/* Live effect picker: interaction itself explains the trigger */\n.fx-settings{border:1px solid #d8e4f2;border-radius:9px;margin:16px 0;overflow:hidden;background:#fff}\n.fx-settings>summary{list-style:none;padding:12px;cursor:pointer;font-weight:750;color:#244262;background:#f0f6ff;font-size:13px}\n.fx-settings>summary::-webkit-details-marker{display:none}\n.fx-settings>summary:after{content:'⌄';float:right;color:#627b9c}\n.fx-settings[open]>summary:after{content:'⌃'}\n.fx-inner{padding:10px}\n.fx-categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:12px}\n.fx-category{padding:8px 3px;min-height:33px;border-radius:6px;background:#f5f7fb;border:1px solid #e0e6ef;color:#40536c;font-size:11px;font-weight:700;cursor:pointer}\n.fx-category.active{background:#dcecff;border-color:#82b3ed;color:#1156a7}\n.fx-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}\n.fx-sample{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:90px;padding:9px 5px;border:1px solid #d4dfec;border-radius:9px;background:#fff;color:#3b4e65;cursor:pointer;overflow:hidden;touch-action:manipulation}\n.fx-sample:hover{border-color:#5a9eea;background:#f7fbff}\n.fx-sample[aria-pressed=true]{border:2px solid #2479de;background:#edf5ff}\n.fx-sample .fx-demo-space{width:100%;height:40px;display:flex;justify-content:center;align-items:center;overflow:visible}\n.fx-sample .fx-demo-object{display:block;width:58px;height:30px;border-radius:8px;background:linear-gradient(130deg,#3685eb,#194e9b);box-shadow:0 3px 9px #1b477c44;transition:transform .3s ease,box-shadow .3s ease,filter .3s ease}\n.fx-sample .fx-demo-name{font-size:11px;font-weight:700;white-space:nowrap;line-height:1.2}\n.fx-demo-hover-lift:hover .fx-demo-object{transform:translateY(-5px);box-shadow:0 11px 16px #1a447c80}\n.fx-demo-hover-zoom:hover .fx-demo-object{transform:scale(1.19)}\n.fx-demo-hover-shadow:hover .fx-demo-object{box-shadow:0 12px 18px #1a447ca0}\n.fx-demo-hover-tilt:hover .fx-demo-object{transform:rotate(-8deg)}\n.fx-demo-hover-tint:hover .fx-demo-object{filter:brightness(1.4) saturate(1.6)}\n.fx-demo-enter-fade .fx-demo-object{animation:fxFade 2.4s both infinite}\n.fx-demo-enter-up .fx-demo-object{animation:fxUp 2.4s both infinite}\n.fx-demo-enter-left .fx-demo-object{animation:fxLeft 2.4s both infinite}\n.fx-demo-enter-zoom .fx-demo-object{animation:fxZoom 2.4s both infinite}\n.fx-demo-enter-blur .fx-demo-object{animation:fxBlur 2.4s both infinite}\n.fx-demo-loop-float .fx-demo-object{animation:fxFloat 2.5s infinite ease-in-out}\n.fx-demo-loop-pulse .fx-demo-object{animation:fxBreath 2.5s infinite ease-in-out}\n.fx-demo-loop-spin .fx-demo-object{animation:fxSpin 3.5s infinite linear}\n.fx-demo-loop-sway .fx-demo-object{animation:fxSway 2.5s infinite ease-in-out}\n.fx-demo-loop-glow .fx-demo-object{animation:fxGlow 2.5s infinite ease-in-out}\n.fx-demo-visual-soft .fx-demo-object{box-shadow:0 5px  // エディターだけの表示設定。編集データ・書き出しHTMLには混ぜません。

   const css=`
/* v0.68: separate screen regions with their own scroll containers */

 .msb-screen-layout>.msb-region{display:none}}
`;
   const slot=(key,active)=>{
     if(!active)return '';

   };

   return {css,start,end:'</div></div>'};
 }

 $('helpBtn').onclick=()=>openModal(`<h2>morhirc Site Builder v0.85</h2><p>白紙からホームページを作成する試作版です。ヘッダーは先頭で透明・スクロール時に背景色付きへ切り替えでき、サイト名とメニューのフォントを個別設定できます。</p><p><b>共通ヘッダー</b><br>「レイアウト」→「共通ヘッダー」から追加・編集できます。設定パネルを閉じていても、このボタンから開き直せます。編集画面では階層メニューの開閉とページ選択ができ、検索はプレビューまたは公開HTMLで利用できます。ファビコンは歯車（サイト設定）から変更できます。全ページ共通のロゴ・サイト名・階層メニュー・サイト内検索を設定できます。スクロール時の固定、スマホ用メニューも対応します。階層構成は各ページの設定で親ページを選択します。フッターは未実装です。<br><b>SEO設定</b><br>各ページの「ページ設定」で検索結果用タイトル・説明文（description）・正規URL（canonical）を設定できます。タイトルは空欄ならページ名とサイト名から自動生成します。canonicalは公開URLが入力されていれば自動生成され、必要な場合だけ個別URLを指定できます。サイト設定（⚙）の「公開URL」を設定すると、サイト一式の書き出し時にsitemap.xmlとrobots.txtも生成されます。</p><p><b>表示の調整</b><br>上部バーの［パネルを開く／閉じる］で右側のパーツ・ページ・レイアウト・サイト設定を切り替えます。［表示倍率］の「画面に収める」はキャンバスを編集領域へ収め、「公開サイズ（仕上がり）」は現在のブラウザ幅で公開HTMLで表示した際の文字・画像の大きさに近づけます。50〜200%の倍率も選択できます。これは表示だけの設定で、保存する座標や公開HTMLの大きさは変更しません。<br><b>基本操作</b><br>右のパーツタブでは基本機能をコンパクトな2列表示にし、追加機能を「レイアウト」「デザイン・図形」「メディア・埋め込み」「サイト共通」に分類しています。カテゴリーを開くとカード・囲み枠・装飾ボタンなども追加できます。影・枠線・余白は各パーツの「装飾」から調整できます。<br>① 右側の「パーツ」タブからパーツを追加します。追加位置は「今見えている場所」「クリックして指定」から選べます。クリック指定はEscで中止できます。<br>② ドラッグで移動、右下でサイズ変更します。<br>③ 文章・見出し・ボタン・四角形の文字はダブルクリックで直接編集します。図形は文字が空欄なら従来どおり図形のみ表示されます。図形内の文字は右の設定でも変更できます。<br>④ 文字編集ツールバー左端の⠿をドラッグすると位置を移動でき、ダブルクリックで自動位置に戻せます。文字をダブルクリックして一部分を範囲選択すると、［詳細］の設定パネルで色・サイズ・フォント・太字・下線を個別に変更できます。色は基本色をワンクリックで選択でき、独自の色は「ユーザー設定の色」の［＋登録］で保存・再利用できます。［削除］を押すと登録色を削除できます。背景や図形の色も同じ方法です。太字と下線は［詳細］から切り替えます。<br>⑤ 背景画像はパーツ未選択の［ページ設定］から画像を選びます。<br>背景セクションを選択すると［コピー］［すぐ下に複製］［貼り付け］が利用できます。背景と中のパーツをまとめてコピーでき、別ページへも貼り付けられます。<br>⑥ 1ページ内で複数の背景を使う場合は「ページ」タブでページ名の矢印を開き、［背景セクション ＋追加］を押し、色・画像・高さを設定します。セクションの下端のハンドルで高さを10pxまで縮められます。<br>⑥ セクションの高さを変えると、下側のパーツも一緒に移動します。新規の文章・見出しパーツは文字量に合わせて自動サイズ調整できます。既存の見出し・文章は右側の「文字量に合わせて枠を自動調整」をオンにするとフィットします。手動で幅・高さを変更すると、その端末だけ自動調整が解除されます。<br>⑦ 右の設定の「動き・効果」では、ホバー・登場・クリック・常時・見た目の各効果をサンプルから選べます。クリックの演出はプレビュー・公開HTMLで確認できます。<br>⑤ 動画はYouTube・Vimeoの共有URLまたは動画ファイルのURLを指定します。<br>⑥ PDF表示はGoogle Driveの共有URLか直接PDF URLを貼り付けます。<br>⑦ Googleフォームは公開用の完全なURLを貼り付けます。<br>⑧ タブレットは［縦］［横］を切り替えます。縦・横・スマホの自動連動はPC版を基準に配置します。［個別編集］にすると端末ごとに独立した配置を保存でき、他端末の個別調整は反映されません。PC・タブレット・スマホを切り替えると、PCを基に初期配置を自動調整します。上のバーの［編集方式］で「自動連動」と「個別編集」を切り替えられます。個別編集を選ぶと端末ごとの配置・文字の見た目を調整でき、切り替えても以前の個別配置は残ります。文字の内容、画像、リンク先は全端末共通です。端末ごとの文字の大きさを変えても他の端末には影響しません。</p><p><b>保存の違い</b><br>［プレビュー］を押すと編集中の文字を確定して、現在のページから表示します。［編集保存］は後から編集を続けられるJSONです。［サイトを書き出す］は全ページとサイトマップを含むHTML一式のZIPです。ページ間リンクを利用する場合はZIPの全ファイルを同じ場所に公開してください。</p><p><b>注意</b><br>編集内容はブラウザにも自動保存しますが、画像が多い場合は容量に注意してください。PDFやGoogleフォームは公開先の共有設定とブラウザ制限によっては埋め込み表示できない場合があります。その際は「別タブで開く」を利用してください。サイトのHTML書き出しだけでは問い合わせを受信できず、Googleフォーム側で収集します。GitHubへの直接公開と詳細な印刷設定は今後の開発対象です。</p><button onclick="document.getElementById('modal').classList.add('hidden')">閉じる</button>`);
 $('newBtn').onclick=()=>{cancelPlacement();if(!confirm('新しい白紙サイトを作成しますか？現在の編集内容は上書きされます。'))return;mutate(()=>{project=blank();pageId=project.pages[0].id;selectedId=null;selectedSectionId=null;headerSelected=false})};
 function openHeaderSettings(focusFavicon=false,enableIfMissing=false){
   if(focusFavicon){renderSiteSettingsPanel();dockOpen=true;openDock('site');return}
   cancelPlacement();finishInlineEdit();selectedId=null;selectedSectionId=null;headerSelected=true;
   if(enableIfMissing&&siteHeader().enabled!==true){record();project.header=project.header||defaultHeader();project.header.enabled=true;saveLocal()}
   layoutPanelView='header';dockOpen=true;renderCanvas();renderLayoutPanel();openDock('layout');
   $('layoutPanel').scrollTop=0;
 }
 document.querySelectorAll('[data-special]').forEach(button=>{
   button.onclick=()=>{if(button.dataset.special==='header')openHeaderSettings(false,true);else openHeaderSettings(true);};
 });
 $('siteHeaderEditor').onclick=ev=>{if(ev.target.closest('.header-editor-menu-item,.header-editor-mobile-panel,.header-mobile-icon'))return;openHeaderSettings()};
 $('siteHeaderEditor').onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();$('siteHeaderEditor').click()}};
 $('addPageBtn').onclick=()=>{cancelPlacement();const title=prompt('新しいページ名を入力してください','新しいページ');if(title===null)return;mutate(()=>{let slug=validSlug(title);let base=slug,n=2;while(project.pages.some(p=>p.slug===slug))slug=base+'-'+n++;const p={id:uid(),title:title||'新しいページ',slug,background:'#ffffff',backgroundImage:'',backgroundSize:'cover',backgroundPosition:'center',sections:[],elements:[]};project.pages.push(p);pageId=p.id;expandedPageId=p.id;selectedId=null;selectedSectionId=null;headerSelected=false});openDock('pages')};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>requestAddElement(b.dataset.add));
 $('addPlacement').onchange=()=>cancelPlacement();
 // Accordion state is editor UI preference, not part of exported project JSON.
 const categoryStorageKey='morhirc-sitebuilder-categories-v036';
 try{const stored=JSON.parse(localStorage.getItem(categoryStorageKey)||'null');if(Array.isArray(stored))document.querySelectorAll('.catalog-group').forEach(d=>{d.open=stored.includes(d.dataset.category)})}catch{}
 document.querySelectorAll('.catalog-group').forEach(d=>d.addEventListener('toggle',()=>{
   try{localStorage.setItem(categoryStorageKey,JSON.stringify([...document.querySelectorAll('.catalog-group')].filter(x=>x.open).map(x=>x.dataset.category)))}catch{}
 }));
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{cancelPlacement();finishInlineEdit();device=b.dataset.view;selectedId=null;selectedSectionId=null;renderAll()});
 document.querySelectorAll('[data-orientation]').forEach(b=>b.onclick=()=>{cancelPlacement();finishInlineEdit();device=b.dataset.orientation;selectedId=null;selectedSectionId=null;renderAll()});
 // 編集方式は各ページ・各端末別に保持。自動に切り替えても個別配置を削除しません。
 $('responsiveModeSelect').onchange=ev=>{
   if(device==='desktop')return;
   const mode=ev.target.value;
   if(!['auto','manual'].includes(mode))return;
   finishInlineEdit();cancelPlacement();
   if(isAutoMode(page(),device)===(mode==='auto'))return;
   mutate(()=>{
     const p=page();
     if(mode==='auto'){
       // v0.77以前に作った個別配置も保存したまま自動表示へ切り替えます。
       p.responsiveManualSaved={...(p.responsiveManualSaved||{}),[device]:true};
       p.responsiveMode={...(p.responsiveMode||{}),[device]:'auto'};
     }else if(p.responsiveManualSaved?.[device]){
       // 前回の個別編集を復元します。初期状態に戻して上書きしません。
       p.responsiveMode={...(p.responsiveMode||{}),[device]:'manual'};
     }else{
       // 初めての個別編集は、現在の自動表示をそのまま固定します。
       freezeDeviceLayout(p,device);
     }
   });
   notify(mode==='auto'?'自動連動に切り替えました。個別配置は保持しています。':'個別編集に切り替えました。この端末だけ調整できます。');
 };
 $('gridOverlayBtn').onclick=()=>{grid=!grid;updateGridOverlay();persistEditorView()};
 $('projectName').onchange=ev=>mutate(()=>project.title=ev.target.value||'新しいサイト');
 $('saveBtn').onclick=()=>{finishInlineEdit();download(new Blob([JSON.stringify(project,null,2)],{type:'application/json;charset=utf-8'}),'site-project.json');notify('編集用プロジェクトを保存しました。')};
 $('loadBtn').onclick=()=>$('openFile').click();
 $('openFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.pages)||!data.pages.length||!data.pages.every(p=>p.id&&Array.isArray(p.elements)))throw Error('不正な形式');if(!confirm('現在の編集内容を読み込みファイルで置き換えますか？'))return;mutate(()=>{project=data;if(!Array.isArray(project.userColors))project.userColors=storedUserColors();else try{localStorage.setItem(USER_COLORS_KEY,JSON.stringify(cleanUserColors(project.userColors)))}catch{};pageId=data.pages[0].id;selectedId=null;selectedSectionId=null});notify('プロジェクトを読み込みました。')}catch(e){notify('JSONファイルを読み込めませんでした。')}finally{ev.target.value=''}};
 $('imageFile').onchange=async ev=>{const f=ev.target.files[0];if(f)try{await readImage(f)}catch{notify('画像を読み込めませんでした。')}ev.target.value=''};
 $('hoverSwapImageFile').onchange=async ev=>{
   const f=ev.target.files?.[0];ev.target.value='';if(!f)return;
   const e=selected();if(!e||e.type!=='image')return notify('画像パーツを選択してください。');
   if(!['image/png','image/jpeg','image/webp','image/gif'].includes(f.type))return notify('PNG・JPEG・WebP・GIFを選択してください。');
   if(f.size>12*1024*1024)return notify('画像は12MB以下にしてください。');
   try{const src=await new Promise((ok,fail)=>{const reader=new FileReader();reader.onload=()=>ok(String(reader.result||''));reader.onerror=fail;reader.readAsDataURL(f)});
     if(!safeBackgroundImage(src))throw Error('invalid image');
     mutate(()=>{const found=page().elements.find(part=>part.id===e.id);if(found){found.hoverAltImage=src;found.hoverSwapEnabled=true;}});
     notify('ホバー時の画像を登録しました。');
   }catch{notify('画像を読み込めませんでした。')}
 };

 $('headerLogoFile').onchange=async ev=>{
   const file=ev.target.files[0];ev.target.value='';if(!file)return;
   if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type))return notify('ロゴはPNG・JPEG・WebP・GIFを選んでください。');
   if(file.size>1024*1024)return notify('ロゴ画像は1MB以下を推奨します。ファイルを小さくしてください。');
   try{const src=await new Promise((ok,fail)=>{const reader=new FileReader();reader.onload=()=>ok(reader.result);reader.onerror=fail;reader.readAsDataURL(file)});
     if(!safeBackgroundImage(src))return notify('画像形式を確認してください。');
     mutate(()=>siteHeader().logo=src);notify('ヘッダーロゴを設定しました。');
   }catch{notify('ロゴ画像を読み込めませんでした。')}
 };
 $('faviconFile').onchange=async ev=>{const f=ev.target.files?.[0];ev.target.value='';if(f)await readFavicon(f)};
 $('pageBgFile').onchange=async ev=>{const f=ev.target.files[0];if(f)try{await readBackground(f)}catch{notify('背景画像を読み込めませんでした。')}ev.target.value=''};
 $('paper').addEventListener('dragover',ev=>ev.preventDefault());
 $('paper').addEventListener('drop',async ev=>{ev.preventDefault();const f=[...ev.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(!f)return notify('画像ファイルをドロップしてください。');const r=$('paper').getBoundingClientRect();const at=normalizedPlacement('image',(ev.clientX-r.left)/editorZoom,(ev.clientY-r.top)/editorZoom);cancelPlacement();selectedId=null;await readImage(f,at)});

 $('exportBtn').onclick=()=>{finishInlineEdit();const files=buildExportFiles();download(zipFiles(files),validSlug(project.title)+'.zip');notify('HTML一式をZIPで書き出しました。')};
 $('previewBtn').onclick=()=>{finishInlineEdit();const f=new Blob([buildSitePreview()],{type:'text/html;charset=utf-8'});const u=URL.createObjectURL(f);const w=window.open(u,'_blank');if(!w)notify('ポップアップを許可してください。');setTimeout(()=>URL.revokeObjectURL(u),60000)};
 $('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
 $('toggleDockPanel').onclick=()=>{dockOpen=!dockOpen;refreshPanelLayout();persistEditorView()};
 $('dockClose').onclick=()=>{dockOpen=false;refreshPanelLayout();persistEditorView()};
 // Hide verbose guidance unless explicitly requested; preserve warnings and all controls.
 $('dockHintsToggle').onclick=()=>{
   const show=document.body.classList.toggle('msb-hints-on');
   const button=$('dockHintsToggle');button.setAttribute('aria-pressed',String(show));
   button.setAttribute('aria-label',show?'説明文を非表示':'説明文を表示');
   button.title=show?'説明文を非表示':'説明文を表示';
 };
 $('dockTabTools').onclick=()=>openDock('tools');
 $('dockTabPages').onclick=()=>{renderPages();renderSections();openDock('pages')};
 $('dockTabProps').onclick=()=>{renderSiteSettingsPanel();openDock('site')};
 $('dockTabLayout').onclick=()=>{renderLayoutPanel();openDock('layout')};
 $('openLayoutDesign').onclick=()=>{renderLayoutPanel();openDock('layout')};
 $('editorZoomMode').onchange=ev=>{editorZoomMode=ev.target.value;applyEditorZoom();persistEditorView()};
 if('ResizeObserver' in window)new ResizeObserver(()=>applyEditorZoom()).observe($('workarea'));
 window.addEventListener('resize',applyEditorZoom,{passive:true});
 document.addEventListener('keydown',ev=>{const inField=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable;
   if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&!inField&&ev.key.toLowerCase()==='c'&&selectedSectionId){ev.preventDefault();copySection();}
   if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&!inField&&ev.key.toLowerCase()==='v'&&sectionClipboard&&!selected()){ev.preventDefault();pasteSection(selectedSectionId||null);}
   if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'&&!inField){ev.preventDefault();ev.shiftKey?redo():undo()}
   if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='y'&&!inField){ev.preventDefault();redo()}
   if((ev.key==='Delete'||ev.key==='Backspace')&&!inField&&selected()){ev.preventDefault();const id=selectedId;mutate(()=>{page().elements=page().elements.filter(e=>e.id!==id);selectedId=null})}
   if(ev.key==='Escape'){if(partDetailOpen){closePartDetails();return}if(pendingPlacementType){cancelPlacement();notify('位置指定を中止しました。');return}closeModal();if(editingId)return;selectedId=null;selectedSectionId=null;renderCanvas();renderInspector();renderSections()}
 });
 refreshPanelLayout();
 renderAll();
})();
</script>
</body>
</html>
